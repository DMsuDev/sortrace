#
#  Builds the library, tests and examples with strict warnings on
#  Linux (GCC, Clang) and Windows (MSVC), then runs the tests and the examples.
# ==============================================================================

name: CI

# ------------------------------------------------------------------------------
#  Triggers
# ------------------------------------------------------------------------------
on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "include/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/ci.yml"

  pull_request:
    paths:
      - "examples/**"
      - "include/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/ci.yml"
    
  workflow_dispatch:

# ------------------------------------------------------------------------------
#  Jobs
# ------------------------------------------------------------------------------
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false # A failure on one platform must not hide the others.
      matrix:
        include:
          - { name: Ubuntu GCC 13,   os: ubuntu-24.04,   cc: gcc-13,   cxx: g++-13 }
          - { name: Ubuntu Clang 18, os: ubuntu-24.04,   cc: clang-18, cxx: clang++-18 }
          - { name: Windows MSVC,    os: windows-latest, cc: "",       cxx: "" }

    steps:
      # ---- Source ------------------------------------------------------------
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ---- Build -------------------------------------------------------------
      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSORTRACE_STRICT_WARNINGS=ON

      - name: Build
        run: cmake --build build --config Release

      # ---- Verify ------------------------------------------------------------
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # playback_animate is skipped: it sleeps between frames to animate in real time.
      - name: Run the basic examples
        shell: bash
        run: |
          for exe in $(find build/bin -path '*/basic/*' -type f \( -name '*.exe' -o -perm -u+x \) ! -name 'playback_animate*'); do
            echo "== $exe"
            "$exe" > /dev/null
          done
